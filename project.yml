name: HAENA
options:
  # The checked-out `project.pbxproj` carries no XcodeGen setting presets, so a plain
  # `xcodegen generate` would re-add ~140 lines of defaults that are not part of this project's
  # intent. Stating it here makes the committed project file reproducible from this spec.
  settingPresets: none
  bundleIdPrefix: com.haena
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.3"
    CURRENT_PROJECT_VERSION: "7"
    ALWAYS_SEARCH_USER_PATHS: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_TESTABILITY: NO
      ONLY_ACTIVE_ARCH: NO
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_COMPILATION_MODE: wholemodule
      # Swift embeds source/object paths in Release metadata unless they are remapped. Keep local
      # usernames and checkout locations out of the distributable Mach-O while preserving useful
      # relative paths in its separate dSYM.
      OTHER_SWIFT_FLAGS: "$(inherited) -debug-prefix-map $(SRCROOT)=."
      # The prefix map above only reaches paths the *compiler* writes. The debug map the linker
      # writes — one N_OSO stab per object file — still carries the absolute path of the build
      # machine's DerivedData directory, and with it whichever account did the build. That is not
      # user data, but it is a local absolute path in a binary handed to other people, so the
      # symbol table is stripped out of the shipped executable. Debug information itself is not
      # lost: `dwarf-with-dsym` above has already written it to a separate dSYM that stays here.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all

targets:
  HAENA:
    type: application
    platform: macOS
    sources:
      # Benchmark is tooling, not product code. It is compiled only by HAENABenchmarkCLI and
      # HAENABenchmarkTests below, so no Debug or Release HAENA.app can contain its implementation.
      - path: HAENA
        excludes:
          - Benchmark
    info:
      path: HAENA/Info.plist
      properties:
        CFBundleDisplayName: HAE.NA
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        # Shown verbatim in the system permission prompt. macOS refuses to open the microphone
        # without it — the process is terminated rather than merely denied.
        NSMicrophoneUsageDescription: HAE.NA가 회의를 녹음하고 전사하기 위해 마이크 접근 권한이 필요합니다.
    entitlements:
      path: HAENA/HAENA.entitlements
      properties:
        # Declared for microphone capture. App Sandbox itself is deliberately NOT enabled: turning
        # it on moves the app's container, which would orphan the projects.json and stored audio a
        # user already has. Sandboxing is a migration of its own, not a flag to flip beside a feature.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haena.HAENA
        PRODUCT_NAME: HAENA
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HAENATests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HAENATests
        excludes:
          - BenchmarkAccessPolicyTests.swift
          - BenchmarkAdapterTests.swift
          - BenchmarkArtifactSchemaTests.swift
          - BenchmarkCaseStoreTests.swift
          - BenchmarkCommandLineTests.swift
          - BenchmarkFixtures.swift
          - BenchmarkIdentityTests.swift
          - BenchmarkPrivacyTests.swift
          - BenchmarkRepositoryIsolationTests.swift
          - BenchmarkRunnerTests.swift
          - SemanticScorerInputStoreTests.swift
          - SemanticScoringAccountingTests.swift
          - SemanticScoringMetricsTests.swift
          - AudioBenchmarkIsolationTests.swift
          - AudioBenchmarkRunnerTests.swift
          - AudioBenchmarkScorerTests.swift
          - AudioBenchmarkSyntheticEndToEndTests.swift
    dependencies:
      - target: HAENA
    settings:
      base:
        PRODUCT_NAME: HAENATests
        PRODUCT_BUNDLE_IDENTIFIER: com.haena.HAENATests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Development-only benchmark harness runner. It compiles the domain layers it needs rather than
  # linking the application target. Benchmark source is therefore unreachable from HAENA.app and
  # Persistence remains absent from the CLI's link graph.
  HAENABenchmarkCLI:
    type: tool
    platform: macOS
    sources:
      - path: HAENA/Models
      # The two pieces of Extraction left out are the two that reach a `ProjectRepository`:
      # `WorkStateExtractionService` writes to one, and `MeetingReanalysis` reads one to decide
      # whether a stored meeting may be analysed again. Excluding both means no repository type is
      # compiled into the harness binary at all, so "the harness cannot touch a user's projects"
      # is enforced by the link step rather than by reviewer discipline.
      - path: HAENA/Extraction
        excludes:
          - WorkStateExtractionService.swift
          - MeetingReanalysis.swift
      # Provider-neutral extraction now carries the Transition Engine's typed signal contract and
      # approved-state snapshot types. Include only those value definitions; the CLI still cannot
      # compile the engine, either repository, or either write service.
      - path: HAENA/Continuity
        excludes:
          # Manual Brief reads application repositories and its review service mutates Project
          # state. Neither belongs in the offline Benchmark CLI's provider-neutral value graph.
          - ManualContinuityBrief.swift
          - WorkStateTransitionReviewService.swift
          - WorkStateContinuityService.swift
          - WorkStateTransitionEngine.swift
          - WorkStateTransitionRepository.swift
          # The deletion closure is a pure value type, but it is expressed over
          # `WorkStateTransitionApplyIntent` and `MeetingDeletionIntent`, which are declared in the
          # repository file above. Compiling it here would either fail to resolve those types or
          # force the repository back into the harness — and the whole point of that exclusion is
          # that no repository type is linked into the CLI at all.
          - MeetingDeletionClosure.swift
      - path: HAENA/Credentials
      # The CLI compiles the app's provider-neutral transcription seam and OpenAI adapter so an
      # explicitly approved future live run can normalize the same diarized response contract.
      # Audio v0 itself wires only the offline fake provider; adding these sources does not add a
      # dependency from HAENA.app back to Benchmark.
      - path: HAENA/Transcription
      - path: HAENA/Benchmark
      - path: HAENABenchmarkCLI
    settings:
      base:
        PRODUCT_NAME: haena-benchmark
        PRODUCT_BUNDLE_IDENTIFIER: com.haena.HAENABenchmarkCLI

  # Hosted only to reuse HAENA's internal domain seams through @testable import. The benchmark
  # implementation itself belongs to this test bundle, never to the application target.
  HAENABenchmarkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HAENA/Benchmark
      - path: HAENATests/BenchmarkAccessPolicyTests.swift
      - path: HAENATests/BenchmarkAdapterTests.swift
      - path: HAENATests/BenchmarkArtifactSchemaTests.swift
      - path: HAENATests/BenchmarkCaseStoreTests.swift
      - path: HAENATests/BenchmarkCommandLineTests.swift
      - path: HAENATests/BenchmarkFixtures.swift
      - path: HAENATests/BenchmarkIdentityTests.swift
      - path: HAENATests/BenchmarkPrivacyTests.swift
      - path: HAENATests/BenchmarkRepositoryIsolationTests.swift
      - path: HAENATests/BenchmarkRunnerTests.swift
      - path: HAENATests/SemanticScorerInputStoreTests.swift
      - path: HAENATests/SemanticScoringAccountingTests.swift
      - path: HAENATests/SemanticScoringMetricsTests.swift
      - path: HAENATests/AudioBenchmarkIsolationTests.swift
      - path: HAENATests/AudioBenchmarkRunnerTests.swift
      - path: HAENATests/AudioBenchmarkScorerTests.swift
      - path: HAENATests/AudioBenchmarkSyntheticEndToEndTests.swift
      - path: HAENATests/ExtractionTestDoubles.swift
      - path: HAENATests/TestFixtures.swift
    dependencies:
      - target: HAENA
    settings:
      base:
        PRODUCT_NAME: HAENABenchmarkTests
        PRODUCT_BUNDLE_IDENTIFIER: com.haena.HAENABenchmarkTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BENCHMARK_TEST_TARGET"

  HAENAUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: HAENAUITests
    dependencies:
      - target: HAENA
    settings:
      base:
        PRODUCT_NAME: HAENAUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.haena.HAENAUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HAENA

schemes:
  HAENA:
    build:
      targets:
        HAENA: all
        HAENATests: [test]
        HAENABenchmarkTests: [test]
        HAENAUITests: [test]
    test:
      config: Debug
      targets:
        - HAENATests
        - HAENABenchmarkTests
        - HAENAUITests
    run:
      config: Debug
  HAENABenchmarkCLI:
    build:
      targets:
        HAENABenchmarkCLI: all
    run:
      config: Debug
